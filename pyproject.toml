[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["venv", "core/database/migrations", "bot/handlers", "core/services", "core/utils", "core/database/crud.py", "core/database/database.py", "core/database/models.py", "bot/main.py", "bot/config.py", "bot/states.py", "bot/middlewares", "main.py", "res_db.py", "reset_db.py", "reset_alembic.py", "test_panel.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
